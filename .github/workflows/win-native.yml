name: Native Windows

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build and smoke-test the NSIS installer
        required: false
        type: boolean
        default: true
      test_group:
        description: Run all checks or diagnose one Windows group
        required: false
        type: choice
        default: all
        options:
          - all
          - desktop
          - core
          - providers
          - server
          - cli
          - daemon
          - worktree
          - desktop-worktree

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.test_group == 'all' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GOMEMLIMIT: 3GiB
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  windows:
    name: Windows (${{ matrix.group }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJSON(inputs.test_group == 'desktop-worktree' && '["desktop","worktree"]' || inputs.test_group && inputs.test_group != 'all' && format('["{0}"]', inputs.test_group) || '["desktop","core","providers","server","cli","daemon"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Bun
        if: matrix.group == 'providers'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - name: Enable package manager
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install dependencies
        id: dependencies
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force .rt/windows-native | Out-Null
          pnpm install --frozen-lockfile 2>&1 | Tee-Object -FilePath .rt/windows-native/install.log
          exit $LASTEXITCODE
      - name: Verify native host
        run: |
          node -e "if(process.platform !== 'win32' || process.arch !== 'x64') process.exit(1); console.log(process.version, process.platform, process.arch)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - name: Typecheck
        if: matrix.group == 'core'
        timeout-minutes: 15
        run: pnpm exec turbo run typecheck --concurrency=2 --env-mode=loose --continue=always
      - name: Test Windows runtime and shared contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          $packages = @{
            desktop = '@bb/desktop'
            core = '@bb/domain @bb/process-utils @bb/config @bb/host-daemon-contract @bb/host-workspace @bb/host-watcher @bb/provider-bridge-protocol @bb/provider-bridge-acp @bb/plugin-build @bb/local-open-targets bb-app @bb/templates bb-plugin-bb-guide @bb/plugin-registry @get-bb/plugin-sdk bb-plugin-environment-git-worktree bb-plugin-environment-personal-workspace'
            providers = '@bb/agent-runtime @bb/provider-parity bb-plugin-provider-claude-code bb-plugin-provider-codex bb-plugin-provider-pi'
            server = '@bb/server'
            cli = '@bb/cli'
            daemon = '@bb/host-daemon'
            worktree = 'bb-plugin-environment-git-worktree'
          }
          $filters = @($packages[$env:TEST_GROUP] -split '\s+' | ForEach-Object { "--filter=$_" })
          $testArguments = @('exec', 'turbo', 'run', 'test') + $filters + @(
            '--concurrency=1', '--env-mode=loose', '--continue=always', '--log-order=stream',
            '--', '--maxWorkers=1', '--maxConcurrency=2', '--reporter=default', '--reporter=json', '--outputFile=.rt/windows-tests.json'
          )
          Write-Output "Processes before tests: $(@(Get-Process).Count)"
          $testExitCode = 1
          try {
            pnpm.cmd @testArguments
            $testExitCode = $LASTEXITCODE
          } finally {
            $processes = Get-Process | Select-Object Id, ProcessName, HandleCount, WorkingSet64
            $processes | ConvertTo-Json | Set-Content .rt/windows-native/processes-after-tests.json
            $processes | Group-Object ProcessName | Sort-Object Count -Descending | Select-Object -First 10 Name, Count | Format-Table
          }
          exit $testExitCode
      - name: Real ConPTY
        if: ${{ !cancelled() && matrix.group == 'desktop' && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: node apps/desktop/scripts/smoke-windows-conpty.mjs
      - name: Build installer
        id: installer
        if: ${{ !cancelled() && matrix.group == 'desktop' && steps.dependencies.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.build_installer }}
        timeout-minutes: 25
        env:
          BB_DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
        run: pnpm exec turbo run desktop:build:win --filter=@bb/desktop --concurrency=2 --env-mode=loose
      - name: Generate Windows version feed
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        env:
          BB_DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter @bb/desktop desktop:version-feed
      - name: Packaged app and native dependencies
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        timeout-minutes: 5
        run: node apps/desktop/scripts/smoke-packaged-app.mjs
      - name: Packaged process cleanup
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        timeout-minutes: 5
        run: node apps/desktop/scripts/smoke-windows-processes.mjs --evidence-dir .rt/windows-native/unpacked
      - name: Installed app lifecycle
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $installer = @(Get-ChildItem apps/desktop/release/*Setup*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'bb install Кириллица'
          $install = Start-Process $installer[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          try {
            node apps/desktop/scripts/smoke-packaged-app.mjs --app-path "$installDir/wbb.exe"
            if ($LASTEXITCODE) { throw 'Installed app smoke failed' }
            node apps/desktop/scripts/smoke-windows-processes.mjs --app-path "$installDir/wbb.exe" --evidence-dir .rt/windows-native/installed
            if ($LASTEXITCODE) { throw 'Installed process cleanup failed' }
          } finally {
            $uninstaller = @(Get-ChildItem $installDir/*Uninstall*.exe)
            if ($uninstaller.Count -ne 1) { throw 'Expected one uninstaller' }
            $uninstall = Start-Process $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          }
          if (Test-Path "$installDir/wbb.exe") { throw 'Uninstaller left the installed application' }
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ matrix.group }}-${{ github.run_id }}
          include-hidden-files: true
          path: |
            apps/*/.rt/windows-tests.json
            packages/*/.rt/windows-tests.json
            plugins/*/.rt/windows-tests.json
            .rt/windows-native/**
      - name: Upload installer candidate
        if: success() && matrix.group == 'desktop' && github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*Setup*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/desktop-version-windows.json
