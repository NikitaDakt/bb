name: Native Windows

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build and smoke-test the NSIS installer
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  BB_DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
  GOMEMLIMIT: 3GiB
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable package manager
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force .rt/windows-native | Out-Null
          pnpm install --frozen-lockfile 2>&1 | Tee-Object -FilePath .rt/windows-native/install.log
          exit $LASTEXITCODE
      - name: Verify native host
        run: |
          node -e "if(process.platform !== 'win32' || process.arch !== 'x64') process.exit(1); console.log(process.version, process.platform, process.arch)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - name: Typecheck
        run: pnpm exec turbo run typecheck --concurrency=2 --env-mode=loose --continue=always
      - name: Test Windows runtime and shared contracts
        run: >-
          pnpm exec turbo run test
          --filter=@bb/domain --filter=@bb/process-utils --filter=@bb/config
          --filter=@bb/host-daemon-contract --filter=@bb/host-workspace --filter=@bb/host-watcher
          --filter=@bb/host-daemon --filter=@bb/server --filter=@bb/cli --filter=@bb/desktop
          --filter=@bb/provider-bridge-protocol --filter=@bb/provider-bridge-acp
          --filter=@bb/plugin-build --filter=@bb/local-open-targets --filter=bb-app
          --filter=@bb/templates --filter=bb-plugin-bb-guide
          --filter=bb-plugin-environment-git-worktree --filter=bb-plugin-environment-personal-workspace
          --concurrency=1 --env-mode=loose --continue=always
          -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.rt/windows-tests.json
      - name: Real ConPTY
        run: node apps/desktop/scripts/smoke-windows-conpty.mjs
      - name: Build installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: pnpm exec turbo run desktop:build:win --filter=@bb/desktop --concurrency=2 --env-mode=loose
      - name: Generate Windows version feed
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: pnpm --filter @bb/desktop desktop:version-feed
      - name: Packaged app and native dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: node apps/desktop/scripts/smoke-packaged-app.mjs
      - name: Packaged process cleanup
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: node apps/desktop/scripts/smoke-windows-processes.mjs --evidence-dir .rt/windows-native/unpacked
      - name: Installed app lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: |
          $installer = @(Get-ChildItem apps/desktop/release/*Setup*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'bb install Кириллица'
          $install = Start-Process $installer[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          try {
            node apps/desktop/scripts/smoke-packaged-app.mjs --app-path "$installDir/wbb.exe"
            if ($LASTEXITCODE) { throw 'Installed app smoke failed' }
            node apps/desktop/scripts/smoke-windows-processes.mjs --app-path "$installDir/wbb.exe" --evidence-dir .rt/windows-native/installed
            if ($LASTEXITCODE) { throw 'Installed process cleanup failed' }
          } finally {
            $uninstaller = @(Get-ChildItem $installDir/*Uninstall*.exe)
            if ($uninstaller.Count -ne 1) { throw 'Expected one uninstaller' }
            $uninstall = Start-Process $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          }
          if (Test-Path "$installDir/wbb.exe") { throw 'Uninstaller left the installed application' }
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ github.run_id }}
          include-hidden-files: true
          path: |
            apps/*/.rt/windows-tests.json
            packages/*/.rt/windows-tests.json
            plugins/*/.rt/windows-tests.json
            .rt/windows-native/**
      - name: Upload installer candidate
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*Setup*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/desktop-version-windows.json
